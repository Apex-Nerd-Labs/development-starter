name: "Build and Push Devcontainer to Registry"

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/devenv/**"
      - ".github/workflows/build-deploy-devcontainer.yaml"

permissions: write-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PACKAGE_NAME: development-machine

jobs:
  build-devenv:
    runs-on: ubuntu-latest
    steps:
    #   - name: Set up Docker Buildx
    #     uses: docker/setup-buildx-action@v3

    #   - name: Setup QEMU
    #     uses: docker/setup-qemu-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Dev Container CI
        uses: devcontainers/ci@v0.3
        with:
            subFolder: src/devenv
            imageName: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.PACKAGE_NAME }}
            platform: linux/amd64,linux/arm64
            push: always